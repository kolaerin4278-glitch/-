<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Дневник привычек</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <div id="privacyScreen"></div>
    <canvas id="confettiCanvas"></canvas>
    
    <header class="ios-fixed-header">
      <div class="header-content">
        <div class="header-left">
          <h1 id="pageHeading">Сегодня</h1>
          <div id="headerDateLabel" class="header-sub-date"></div>
        </div>
        <button type="button" class="header-add-btn" id="addHabitBtn" aria-label="Добавить привычку">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
    </header>

    <main id="mainContent">
      <div class="carousel-wrapper">
        <div class="carousel-pages" id="carouselPages">
          <!-- Страницы будут вставлены через JS -->
        </div>
      </div>
    </main>

    <nav class="ios-island-navbar">
      <div class="nav-tab-btn active" data-tab="today" role="tab" aria-selected="true">
        <span class="nav-icon">📅</span>
        <span class="nav-label">Сегодня</span>
      </div>
      <div class="nav-tab-btn" data-tab="rituals" role="tab" aria-selected="false">
        <span class="nav-icon">🔗</span>
        <span class="nav-label">Ритуалы</span>
      </div>
      <div class="nav-tab-btn" data-tab="analytics" role="tab" aria-selected="false">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Анализ</span>
      </div>
      <div class="nav-tab-btn" data-tab="mastery" role="tab" aria-selected="false">
        <span class="nav-icon">🏆</span>
        <span class="nav-label">Мастерство</span>
      </div>
      <div class="nav-tab-btn" data-tab="settings" role="tab" aria-selected="false">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">Опции</span>
      </div>
      <div class="nav-slider-pill"></div>
    </nav>

    <div id="dynamicIsland" class="dynamic-island" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
